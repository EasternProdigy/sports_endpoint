name = "matrix-scoreboard-worker"
main = "cloudflare_worker.js"
compatibility_date = "2026-02-13"
workers_dev = true

# Add your Cloudflare Account ID here or set CLOUDFLARE_ACCOUNT_ID in CI/secrets
# account_id = ""

[observability]
enabled = true

# KV binding used by cloudflare_worker.js
[[kv_namespaces]]
binding = "CONTROL_KV"
id = "b1325c57c7934f6b8ee8551ae93ed2fc"
preview_id = "80ad5a42308e442dbe065957dc28a948"

[vars]
# Public/non-secret vars (edit as needed)
SPORTS_API_URL = "https://site.api.espn.com/apis/site/v2/sports"
NCAA_SOFTBALL_API_URL = "https://ncaa-api.henrygd.me/scoreboard/softball/d1"
NCAA_BASKETBALL_API_URL = "https://site.api.espn.com/apis/site/v2/sports/basketball/mens-college-basketball/scoreboard"
OLYMPICS_API_URL = "https://api.sportsdata.io/v3/olympics/scores/json/Competitions"
SOCCER_API_URL = "https://api.football-data.org/v4/matches"
INDIVIDUAL_SPORTS_API_URL = "https://site.api.espn.com/apis/site/v2/sports/tennis/atp/scoreboard"
WELLESLEY_SOFTBALL_URL = "https://wellesleyblue.com/services/schedule_txt.ashx?schedule=366"
# Set via `wrangler secret put` in real deploys:
# SOCCER_API_TOKEN
# OLYMPICS_API_KEY
